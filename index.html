<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header {
                background-color: #ACC8E5;
                color: #112A46;
                text-align: center; /* Centraliza os textos do cabeçalho */
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid #87CEFA;
            }

            main {
                background-color: #FFFFFF;
                color: #7EC0EE;
                text-align: center; /* Centraliza os textos dentro do main */
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
                flex-direction: column; /* Coloca os elementos um embaixo do outro */
                align-items: center; /* Centraliza a imagem e os blocos no meio */
                justify-content: center;
            }

            main img {
                width: 80px;
                height: 80px;
            }

            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head> 
    <body> 
        <header>
            <h1>Curiosidades sobre os gatos</h1>
            <h2>Minha página sobre curiosidades sobre os gatos</h2>
            <p>Vou compartilhar curiosidades sobre os gatos</p>
        </header>
        
        <main>
            <img src="caminho-da-imagem.jpg" alt="Foto sobre gatos">   
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Karine Almeida</p> 
            <p>Sejam bem-vindos ao meu novo blog! Aqui vou compartilhar curiosidades sobre os gatos</p>
        </main>
    </body>
</html>
