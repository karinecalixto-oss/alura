<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header {
                background-color: #ACC8E5;
                color: #112A46; /* 'color' com 'c' minúsculo */
                text-align: center;
                max-width: 800px;
                margin: 0 auto; /* Espaço adicionado entre 0 e auto */
                padding: 16px;
                border: 5px solid #87CEFA; /* Cor da borda ajustada */
            }

            main {
                background-color: #FFFFFF;
                color: #7EC0EE;
                text-align: center;
                max-width: 800px;
                margin: 0 auto; /* Espaço adicionado entre 0 e auto */
                padding: 16px;
                display: flex;
                flex-direction: column; /* Faz os elementos ficarem um embaixo do outro */
                align-items: center; /* Centraliza os itens na tela */
            }

            /* Estilo para ajustar a imagem */
            main img {
                width: 80px;
                height: 80px;
            }

            /* Correção da classe do autor */
            .artigo-autor {
                font-weight: bold; /* 'font-weight' corrigido */
            }
        </style>
    </head> 
    <body> 
        <header>
            <h1>Curiosidades sobre os gatos</h1>
            <h2>Minha página sobre curiosidades sobre os gatos</h2>
            <p>Vou compartilhar curiosidades sobre os gatos</p>
        </header>
        
        <main>
            <img src="caminho-da-imagem.jpg" alt="Foto sobre gatos">   
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Karine Almeida</p> 
            <p>Sejam bem-vindos ao meu novo blog! Aqui vou compartilhar curiosidades sobre os gatos</p>
        </main>
    </body>
</html>
